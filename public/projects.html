<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المشاريع المصغرة | آت يونس تك</title><link rel="stylesheet" href="/css/site-shell.css"><style>body{margin:0;background:#f5f7f6;font-family:Cairo,Segoe UI,sans-serif}.page{width:min(1100px,calc(100% - 32px));margin:40px auto}.project{background:#fff;border:1px solid #dce4e8;border-radius:6px;padding:24px;margin-bottom:14px}.project h1{margin:0 0 10px;color:#16715b}.roles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}.role{background:#e8f2ee;padding:10px;border-radius:4px;color:#185b4b;font-size:13px}.role strong{display:block;margin-bottom:4px}@media(max-width:760px){.roles{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="page"><article class="project"><h1>مشاريع مصغرة</h1><p>كل مشروع يُعرض ببطاقة واضحة قبل فتح باب المشاركة أو التمويل.</p><div class="roles"><div class="role"><strong>صاحب الفكرة وشركاؤه</strong>الرؤية والتنفيذ</div><div class="role"><strong>مساعدو المشروع</strong>الدعم والمتابعة</div><div class="role"><strong>خبير عقاري</strong>التقييم العقاري</div><div class="role"><strong>محامي المشروع</strong>المراجعة القانونية</div><div class="role"><strong>محاسب المشروع</strong>الميزانية والتقارير</div><div class="role"><strong>ممول المشروع</strong>مصادر التمويل</div><div class="role"><strong>مسوق المشروع</strong>الوصول والعملاء</div></div></article></main><script src="/js/site-shell.js"></script></body></html>
