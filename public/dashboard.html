<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم | آت يونس تك</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      font-family: 'Tajawal', sans-serif;
      background: #f0f4f8;
      margin: 0;
      padding: 20px;
    }
    .dashboard-container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 30px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #e9ecef;
      padding-bottom: 20px;
      margin-bottom: 30px;
    }
    .header h1 {
      margin: 0;
      color: #2c3e50;
      font-size: 28px;
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .user-info .username {
      font-weight: bold;
      color: #2c3e50;
    }
    .logout-btn {
      background: #dc3545;
      color: white;
      border: none;
      padding: 8px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.3s;
    }
    .logout-btn:hover {
      background: #c82333;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      transition: transform 0.2s;
    }
    .stat-card:hover {
      transform: translateY(-3px);
    }
    .stat-card .number {
      font-size: 32px;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 5px;
    }
    .stat-card .label {
      color: #6c757d;
      font-size: 14px;
    }
    .section {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 12px;
      margin-top: 20px;
    }
    .section h2 {
      margin-top: 0;
      color: #2c3e50;
      font-size: 20px;
    }
    .referral-link {
      background: white;
      padding: 15px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .referral-link code {
      background: #e9ecef;
      padding: 8px 15px;
      border-radius: 6px;
      font-size: 14px;
      word-break: break-all;
    }
    .copy-btn {
      background: #28a745;
      color: white;
      border: none;
      padding: 8px 20px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .copy-btn:hover {
      background: #218838;
    }
    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }
    .message.success {
      display: block;
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .message.error {
      display: block;
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        gap: 15px;
        align-items: stretch;
      }
      .user-info {
        justify-content: space-between;
      }
      .referral-link {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>
<body>
  <div class="dashboard-container" id="dashboard">
    <div class="header">
      <h1>📊 لوحة التحكم</h1>
      <div class="user-info">
        <span class="username" id="username">مرحباً، ...</span>
        <button class="logout-btn" id="logoutBtn">تسجيل الخروج</button>
      </div>
    </div>

    <!-- إحصائيات سريعة -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="number" id="balance">0</div>
        <div class="label">💰 الرصيد</div>
      </div>
      <div class="stat-card">
        <div class="number" id="referralsCount">0</div>
        <div class="label">👥 الإحالات</div>
      </div>
      <div class="stat-card">
        <div class="number" id="earnings">0</div>
        <div class="label">📈 الأرباح</div>
      </div>
      <div class="stat-card">
        <div class="number" id="rank">مبتدئ</div>
        <div class="label">🏆 الرتبة</div>
      </div>
    </div>

    <!-- كود الإحالة -->
    <div class="section">
      <h2>🔗 رابط الإحالة الخاص بك</h2>
      <div class="referral-link">
        <code id="referralLink">جاري التحميل...</code>
        <button class="copy-btn" id="copyBtn">📋 نسخ الرابط</button>
      </div>
      <div class="message" id="copyMessage"></div>
    </div>

    <!-- المهام اليومية -->
    <div class="section">
      <h2>📋 المهام اليومية</h2>
      <div id="dailyTasks">
        <p>جاري تحميل المهام...</p>
      </div>
    </div>

    <!-- سجل النشاطات -->
    <div class="section">
      <h2>📜 سجل النشاطات</h2>
      <div id="activityLog">
        <p>لا توجد نشاطات حتى الآن.</p>
      </div>
    </div>
  </div>

  <script>
    // عرض معلومات المستخدم
    function loadUserInfo() {
      const user = JSON.parse(localStorage.getItem('user'));
      if (!user) {
        window.location.href = '/login.html';
        return;
      }
      document.getElementById('username').textContent = `مرحباً، ${user.username} 👋`;
      document.getElementById('balance').textContent = user.balance || 0;
      document.getElementById('rank').textContent = user.role || 'مبتدئ';
      
      // عرض رابط الإحالة
      const referralLink = `${window.location.origin}/register.html?ref=${user.referralCode}`;
      document.getElementById('referralLink').textContent = referralLink;
    }

    // نسخ الرابط
    document.getElementById('copyBtn').addEventListener('click', function() {
      const link = document.getElementById('referralLink').textContent;
      navigator.clipboard.writeText(link).then(() => {
        const msg = document.getElementById('copyMessage');
        msg.textContent = '✅ تم نسخ الرابط بنجاح!';
        msg.className = 'message success';
        setTimeout(() => { msg.className = 'message'; }, 3000);
      });
    });

    // تسجيل الخروج
    document.getElementById('logoutBtn').addEventListener('click', function() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = '/login.html';
    });

    // تحميل المهام اليومية (تجربة)
    function loadDailyTasks() {
      const tasks = [
        { name: '📱 مشاركة منشور على فيسبوك', points: 10, status: 'pending' },
        { name: '🐦 تغريدة عن المنصة', points: 5, status: 'pending' },
        { name: '📢 دعوة صديق جديد', points: 15, status: 'pending' }
      ];
      const container = document.getElementById('dailyTasks');
      container.innerHTML = tasks.map(task => `
        <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #e9ecef;">
          <span>${task.name}</span>
          <span>${task.points} نقطة</span>
          <button onclick="completeTask('${task.name}')" style="background:#007bff;color:white;border:none;padding:5px 15px;border-radius:6px;cursor:pointer;">إنجاز</button>
        </div>
      `).join('');
    }

    // إنجاز مهمة
    function completeTask(taskName) {
      alert(`✅ تم إنجاز المهمة: ${taskName}`);
    }

    // التحقق من الجلسة
    async function verifySession() {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = '/login.html';
        return;
      }
      try {
        const response = await fetch('/api/auth/verify', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!response.ok) {
          localStorage.removeItem('token');
          localStorage.removeItem('user');
          window.location.href = '/login.html';
        }
      } catch (error) {
        console.error('خطأ في التحقق:', error);
      }
    }

    // تحميل سجل النشاطات (تجربة)
    function loadActivityLog() {
      const log = [
        { date: '2026-08-12 10:30', action: '🔑 تم تسجيل الدخول' },
        { date: '2026-08-12 09:15', action: '📝 تم إنجاز مهمة يومية' }
      ];
      const container = document.getElementById('activityLog');
      if (log.length === 0) {
        container.innerHTML = '<p>لا توجد نشاطات حتى الآن.</p>';
      } else {
        container.innerHTML = log.map(item => `
          <div style="padding:8px 0;border-bottom:1px solid #f0f0f0;">
            <span style="color:#6c757d;font-size:13px;">${item.date}</span>
            <span style="margin-right:10px;">${item.action}</span>
          </div>
        `).join('');
      }
    }

    // تهيئة الصفحة
    document.addEventListener('DOMContentLoaded', function() {
      verifySession();
      loadUserInfo();
      loadDailyTasks();
      loadActivityLog();
    });
  </script>
</body>
</html>
