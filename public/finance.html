<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الإيداع والسحب | آت يونس تك</title><link rel="stylesheet" href="/css/site-shell.css"><style>body{margin:0;background:#f5f7f6;font-family:Cairo,Segoe UI,sans-serif}.page{width:min(900px,calc(100% - 32px));margin:40px auto}.panel{background:#fff;border:1px solid #dce4e8;border-radius:6px;padding:22px;margin-bottom:14px}.panel h1{margin:0 0 8px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{background:#16715b;color:#fff;padding:10px 16px;border-radius:6px;text-decoration:none}.field{margin-top:14px}.field label{display:block;margin-bottom:6px;font-weight:700}.field input,.field select{width:100%;padding:11px;box-sizing:border-box;border:1px solid #ccd3da;border-radius:6px}.submit{margin-top:16px;background:#16715b;color:#fff;border:0;padding:11px 18px;border-radius:6px;cursor:pointer}.hint{color:#66727d;font-size:13px;line-height:1.8}</style></head><body><main class="page"><section class="panel"><h1>الإيداع والسحب</h1><p class="hint">أرسل طلبًا للمراجعة. لا يتم اعتماد أي حركة مالية قبل التحقق الإداري والإيصال.</p><nav class="tabs"><a class="tab" href="#deposit">طلب إيداع</a><a class="tab" href="#withdraw">طلب سحب</a><a class="tab" href="/profits.html">سجل الأرباح</a></nav></section><section class="panel" id="deposit"><h2>طلب إيداع</h2><div class="field"><label>المبلغ</label><input type="number" min="0" step="0.01" placeholder="أدخل المبلغ"></div><div class="field"><label>طريقة الدفع</label><select><option>بريدي موب</option><option>CCP</option><option>تحويل بنكي</option></select></div><button class="submit" type="button">إرسال طلب الإيداع</button></section><section class="panel" id="withdraw"><h2>طلب سحب</h2><div class="field"><label>المبلغ</label><input type="number" min="0" step="0.01" placeholder="أدخل المبلغ"></div><div class="field"><label>ملاحظات الحساب</label><input type="text" placeholder="رقم الحساب أو المعلومة المطلوبة"></div><button
