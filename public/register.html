<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل جديد | آت يونس تك</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <h1>📝 تسجيل جديد</h1>
    <form id="registerForm">
      <div class="form-group">
        <label for="username">اسم المستخدم</label>
        <input type="text" id="username" placeholder="أدخل اسم المستخدم" required>
      </div>
      <div class="form-group">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" placeholder="أدخل البريد الإلكتروني" required>
      </div>
      <div class="form-group">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" placeholder="أدخل كلمة المرور (6 أحرف على الأقل)" required minlength="6">
      </div>
      <div class="form-group">
        <label for="referralCode">كود الإحالة (اختياري)</label>
        <input type="text" id="referralCode" placeholder="أدخل كود الإحالة إن وجد">
      </div>
      <button type="submit">تسجيل</button>
    </form>
    <p>لديك حساب؟ <a href="/login.html">سجل الدخول</a></p>
    <div id="message"></div>
  </div>
  <script src="/js/auth.js"></script>
</body>
</html>
