<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>التسجيل | آت يونس تك</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Tajawal', 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .register-container {
      max-width: 680px;
      width: 100%;
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(10px);
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.12);
      padding: 32px 28px;
      border: 1px solid rgba(255,255,255,0.3);
    }
    .logo { text-align: center; margin-bottom: 24px; }
    .logo h1 { font-size: 26px; font-weight: 800; color: #1a2a3a; }
    .logo h1 span { color: #2563eb; }
    .logo p { color: #6c757d; font-size: 14px; margin-top: 4px; }
    .divider { border: none; border-top: 2px solid #e9ecef; margin: 16px 0 24px; }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-weight: 600; font-size: 14px; color: #2c3e50; margin-bottom: 5px; }
    .form-group label .required { color: #dc3545; margin-right: 2px; }
    .form-group .hint { font-size: 12px; color: #6c757d; margin-top: 3px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group input {
      width: 100%; padding: 12px 16px; border: 2px solid #e9ecef; border-radius: 12px;
      font-size: 15px; font-family: inherit; transition: all 0.3s;
      background: #f8f9fa; color: #1a2a3a; direction: ltr;
    }
    .form-group input:focus {
      border-color: #2563eb; outline: none; background: white; box-shadow: 0 0 0 4px rgba(37,99,235,0.1);
    }
    .form-group input.error { border-color: #dc3545; background: #fff5f5; }
    .form-group input.success { border-color: #22c55e; background: #f0fdf4; }

    .referral-code-display {
      background: #e9ecef; border-radius: 12px; padding: 12px 16px;
      display: flex; align-items: center; gap: 12px; border: 2px dashed #adb5bd;
    }
    .referral-code-display .label { font-weight: 600; color: #2c3e50; font-size: 14px; white-space: nowrap; }
    .referral-code-display .code { font-family: monospace; font-size: 18px; font-weight: 700; color: #2563eb; letter-spacing: 2px; flex: 1; text-align: center; }
    .referral-code-display .lock-icon { color: #6c757d; font-size: 16px; }

    .terms-group {
      display: flex; align-items: flex-start; gap: 12px; margin: 8px 0 16px;
      padding: 12px 16px; background: #f8f9fa; border-radius: 12px; border: 1px solid #e9ecef;
    }
    .terms-group input[type="checkbox"] { width: 20px; height: 20px; margin-top: 2px; accent-color: #2563eb; cursor: pointer; flex-shrink: 0; }
    .terms-group label { font-size: 14px; color: #2c3e50; cursor: pointer; line-height: 1.6; }
    .terms-group label a { color: #2563eb; text-decoration: none; font-weight: 600; }
    .terms-group label a:hover { text-decoration: underline; }

    .register-btn {
      width: 100%; padding: 14px; background: #2563eb; color: white; border: none;
      border-radius: 12px; font-size: 18px; font-weight: 700; cursor: pointer;
      transition: all 0.3s; font-family: inherit; margin-top: 8px;
    }
    .register-btn:hover { background: #1d4ed8; transform: translateY(-2px); box-shadow: 0 8px 25px rgba(37,99,235,0.35); }
    .register-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .register-btn .spinner { display: none; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid white; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .message { padding: 12px 16px; border-radius: 12px; font-size: 14px; margin-top: 12px; display: none; }
    .message.show { display: block; }
    .message.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .message.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

    .login-link { text-align: center; margin-top: 18px; font-size: 14px; color: #6c757d; }
    .login-link a { color: #2563eb; text-decoration: none; font-weight: 600; }
    .login-link a:hover { text-decoration: underline; }

    @media (max-width: 600px) {
      body { padding: 12px; }
      .register-container { padding: 20px 16px; border-radius: 20px; }
      .logo h1 { font-size: 22px; }
      .form-row { grid-template-columns: 1fr; gap: 0; }
      .form-group input { font-size: 14px; padding: 10px 14px; }
      .referral-code-display { flex-wrap: wrap; justify-content: center; }
      .referral-code-display .code { font-size: 16px; }
      .terms-group { padding: 10px 14px; }
    }
  </style>
</head>
<body>
  <div class="register-container">
    <div class="logo">
      <h1>آت يونس <span>تك</span></h1>
      <p>منصة الاستثمار الترويجي الذكي</p>
    </div>
    <hr class="divider">

    <form id="registerForm" novalidate>
      <!-- الاسم واللقب -->
      <div class="form-row">
        <div class="form-group">
          <label>الاسم <span class="required">*</span></label>
          <input type="text" id="firstName" placeholder="أدخل الاسم" required>
        </div>
        <div class="form-group">
          <label>اللقب <span class="required">*</span></label>
          <input type="text" id="lastName" placeholder="أدخل اللقب" required>
        </div>
      </div>

      <!-- الهواتف -->
      <div class="form-row">
        <div class="form-group">
          <label>رقم الهاتف العادي <span class="required">*</span></label>
          <input type="tel" id="phone" placeholder="مثال: 0555123456" required>
        </div>
        <div class="form-group">
          <label>رقم واتساب</label>
          <input type="tel" id="whatsapp" placeholder="مثال: 0555123456">
          <div class="hint">اختياري، نفس الرقم إذا لم يكن مختلفاً</div>
        </div>
      </div>

      <!-- اسم المستخدم -->
      <div class="form-group">
        <label>اسم المستخدم <span class="required">*</span></label>
        <input type="text" id="username" placeholder="اختر اسماً فريداً" required>
        <div class="hint">سيظهر اسمك في لوحة التحكم وشبكة الإحالات</div>
      </div>

      <!-- البريد الإلكتروني -->
      <div class="form-group">
        <label>البريد الإلكتروني <span class="required">*</span></label>
        <input type="email" id="email" placeholder="أدخل بريدك الإلكتروني" required>
      </div>
      <div class="form-group">
        <label>تأكيد البريد الإلكتروني <span class="required">*</span></label>
        <input type="email" id="emailConfirm" placeholder="أعد إدخال البريد الإلكتروني" required>
        <div class="hint" id="emailMatchHint"></div>
      </div>

      <!-- كلمة المرور -->
      <div class="form-row">
        <div class="form-group">
          <label>كلمة المرور <span class="required">*</span></label>
          <input type="password" id="password" placeholder="أدخل كلمة المرور" required minlength="6">
          <div class="hint">6 أحرف على الأقل</div>
        </div>
        <div class="form-group">
          <label>تأكيد كلمة المرور <span class="required">*</span></label>
          <input type="password" id="passwordConfirm" placeholder="أعد إدخال كلمة المرور" required>
          <div class="hint" id="passwordMatchHint"></div>
        </div>
      </div>

      <!-- رمز الإحالة -->
      <div class="form-group">
        <label>رمز الإحالة</label>
        <div class="referral-code-display">
          <span class="label">🔗 رمزك:</span>
          <span class="code" id="referralCodeDisplay">جاري التحميل...</span>
          <span class="lock-icon">🔒</span>
        </div>
        <div class="hint">تم إنشاء هذا الرمز تلقائياً وهو فريد لك</div>
        <input type="hidden" id="referralCode" value="">
      </div>

      <!-- الموافقة على الشروط -->
      <div class="terms-group">
        <input type="checkbox" id="termsCheck" required>
        <label for="termsCheck">
          أوافق على 
          <a href="/terms.html" target="_blank">شروط العضوية</a>
          و 
          <a href="/privacy.html" target="_blank">سياسة الخصوصية</a>
          وأقر بأن جميع البيانات المقدمة صحيحة.
        </label>
      </div>

      <button type="submit" class="register-btn" id="registerBtn">
        <span class="spinner" id="spinner"></span>
        <span id="btnText">إنشاء الحساب</span>
      </button>

      <div id="message" class="message"></div>

      <div class="login-link">
        لديك حساب بالفعل؟ <a href="/login.html">سجل الدخول</a>
      </div>
    </form>
  </div>

  <script>
    // ============================================================
    //  توليد كود إحالة عشوائي
    // ============================================================
    function generateReferralCode() {
      return Math.random().toString(36).substring(2, 8).toUpperCase();
    }

    // ============================================================
    //  التحقق من تطابق البريد الإلكتروني
    // ============================================================
    document.getElementById('emailConfirm').addEventListener('input', function() {
      const email = document.getElementById('email').value;
      const confirm = this.value;
      const hint = document.getElementById('emailMatchHint');
      if (confirm && email !== confirm) {
        hint.textContent = '❌ البريد الإلكتروني غير متطابق';
        hint.style.color = '#dc3545';
        this.classList.add('error'); this.classList.remove('success');
      } else if (confirm && email === confirm) {
        hint.textContent = '✅ البريد الإلكتروني متطابق';
        hint.style.color = '#22c55e';
        this.classList.remove('error'); this.classList.add('success');
      } else {
        hint.textContent = '';
        this.classList.remove('error', 'success');
      }
    });

    // ============================================================
    //  التحقق من تطابق كلمة المرور
    // ============================================================
    document.getElementById('passwordConfirm').addEventListener('input', function() {
      const password = document.getElementById('password').value;
      const confirm = this.value;
      const hint = document.getElementById('passwordMatchHint');
      if (confirm && password !== confirm) {
        hint.textContent = '❌ كلمة المرور غير متطابقة';
        hint.style.color = '#dc3545';
        this.classList.add('error'); this.classList.remove('success');
      } else if (confirm && password === confirm) {
        hint.textContent = '✅ كلمة المرور متطابقة';
        hint.style.color = '#22c55e';
        this.classList.remove('error'); this.classList.add('success');
      } else {
        hint.textContent = '';
        this.classList.remove('error', 'success');
      }
    });

    // ============================================================
    //  عرض الرسائل
    // ============================================================
    function showMessage(message, type) {
      const msgDiv = document.getElementById('message');
      msgDiv.textContent = message;
      msgDiv.className = `message show ${type}`;
      setTimeout(() => { msgDiv.className = 'message'; }, 6000);
    }

    // ============================================================
    //  تهيئة رمز الإحالة
    // ============================================================
    function initReferralCode() {
      const urlParams = new URLSearchParams(window.location.search);
      let refCode = urlParams.get('ref');
      if (!refCode) {
        refCode = generateReferralCode();
      }
      document.getElementById('referralCode').value = refCode;
      document.getElementById('referralCodeDisplay').textContent = refCode;
      return refCode;
    }

    // ============================================================
    //  معالجة التسجيل
    // ============================================================
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const btn = document.getElementById('registerBtn');
      const btnText = document.getElementById('btnText');
      const spinner = document.getElementById('spinner');

      // جمع البيانات
      const firstName = document.getElementById('firstName').value.trim();
      const lastName = document.getElementById('lastName').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const whatsapp = document.getElementById('whatsapp').value.trim();
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const emailConfirm = document.getElementById('emailConfirm').value.trim();
      const password = document.getElementById('password').value;
      const passwordConfirm = document.getElementById('passwordConfirm').value;
      const referralCode = document.getElementById('referralCode').value;
      const termsChecked = document.getElementById('termsCheck').checked;

      // التحقق من الحقول المطلوبة
      if (!firstName || !lastName || !phone || !username || !email || !emailConfirm || !password || !passwordConfirm) {
        showMessage('❌ يرجى ملء جميع الحقول المطلوبة.', 'error');
        return;
      }

      // التحقق من تطابق البريد الإلكتروني
      if (email !== emailConfirm) {
        showMessage('❌ البريد الإلكتروني غير متطابق.', 'error');
        return;
      }

      // التحقق من تطابق كلمة المرور
      if (password !== passwordConfirm) {
        showMessage('❌ كلمة المرور غير متطابقة.', 'error');
        return;
      }

      if (password.length < 6) {
        showMessage('❌ كلمة المرور يجب أن تكون 6 أحرف على الأقل.', 'error');
        return;
      }

      if (!termsChecked) {
        showMessage('❌ يرجى الموافقة على شروط العضوية.', 'error');
        return;
      }

      // ✅ تحديد autoActivate (التفعيل التلقائي للمسوقين الرئيسيين)
      const urlParams = new URLSearchParams(window.location.search);
      const refFromUrl = urlParams.get('ref');
      let autoActivate = false;

      if (refFromUrl) {
        try {
          const response = await fetch(`/api/auth/referrals/validate/${refFromUrl}`);
          const data = await response.json();
          // إذا كان كود الإحالة يخص المسوق الرئيسي (slimanepro)
          if (data.valid && data.username === 'slimanepro') {
            autoActivate = true;
          }
        } catch (error) {
          console.error('خطأ في التحقق من كود الإحالة:', error);
        }
      }

      // تعطيل الزر
      btn.disabled = true;
      btnText.textContent = 'جاري التسجيل...';
      spinner.style.display = 'block';

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username,
            email,
            password,
            full_name: `${firstName} ${lastName}`,
            phone,
            whatsapp: whatsapp || phone,
            referralCode,
            autoActivate // ✅ إرسال القيمة
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || 'حدث خطأ في التسجيل');
        }

        // حفظ التوكن والمستخدم
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));

        showMessage(`✅ ${data.message}`, 'success');

        setTimeout(() => {
          window.location.href = '/dashboard.html';
        }, 2000);

      } catch (error) {
        showMessage(`❌ ${error.message}`, 'error');
        btn.disabled = false;
        btnText.textContent = 'إنشاء الحساب';
        spinner.style.display = 'none';
      }
    });

    // ============================================================
    //  تهيئة الصفحة
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
      initReferralCode();
    });
  </script>
  <script src="/js/site-shell.js"></script>
</body>
</html>
