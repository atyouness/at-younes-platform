<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>تسجيل الدخول | آت يونس تك</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* ====== الأنماط الأساسية ====== */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Tajawal', 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-container {
      max-width: 480px;
      width: 100%;
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(10px);
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.12);
      padding: 32px 28px;
      border: 1px solid rgba(255,255,255,0.3);
      transition: all 0.3s;
    }
    .logo { text-align: center; margin-bottom: 24px; }
    .logo h1 { font-size: 26px; font-weight: 800; color: #1a2a3a; }
    .logo h1 span { color: #2563eb; }
    .logo p { color: #6c757d; font-size: 14px; margin-top: 4px; }
    .divider { border: none; border-top: 2px solid #e9ecef; margin: 16px 0 24px; }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-weight: 600; font-size: 14px; color: #2c3e50; margin-bottom: 5px; }
    .form-group label .required { color: #dc3545; margin-right: 2px; }
    .form-group input {
      width: 100%; padding: 12px 16px; border: 2px solid #e9ecef; border-radius: 12px;
      font-size: 15px; font-family: inherit; transition: all 0.3s;
      background: #f8f9fa; color: #1a2a3a; direction: ltr;
    }
    .form-group input:focus {
      border-color: #2563eb; outline: none; background: white; box-shadow: 0 0 0 4px rgba(37,99,235,0.1);
    }
    .form-group input.error { border-color: #dc3545; background: #fff5f5; }

    .login-btn {
      width: 100%; padding: 14px; background: #2563eb; color: white; border: none;
      border-radius: 12px; font-size: 18px; font-weight: 700; cursor: pointer;
      transition: all 0.3s; font-family: inherit; margin-top: 8px;
    }
    .login-btn:hover { background: #1d4ed8; transform: translateY(-2px); box-shadow: 0 8px 25px rgba(37,99,235,0.35); }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .message {
      padding: 12px 16px; border-radius: 12px; font-size: 14px; margin-top: 12px; display: none;
      text-align: center;
    }
    .message.show { display: block; }
    .message.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .message.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .message.info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }

    .links-row {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 16px; flex-wrap: wrap; gap: 10px;
    }
    .links-row a {
      color: #2563eb; text-decoration: none; font-size: 14px; font-weight: 500;
      transition: color 0.3s; cursor: pointer;
    }
    .links-row a:hover { color: #1d4ed8; text-decoration: underline; }

    .register-link { text-align: center; margin-top: 18px; font-size: 14px; color: #6c757d; }
    .register-link a { color: #2563eb; text-decoration: none; font-weight: 600; }
    .register-link a:hover { text-decoration: underline; }

    /* ====== المودال (نافذة منبثقة) ====== */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
      align-items: center; justify-content: center; z-index: 1000;
      padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: white; border-radius: 24px; padding: 32px 28px;
      max-width: 440px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      position: relative;
    }
    .modal-box .close-btn {
      position: absolute; top: 12px; left: 16px; background: none; border: none;
      font-size: 24px; cursor: pointer; color: #6c757d; transition: color 0.3s;
    }
    .modal-box .close-btn:hover { color: #dc3545; }
    .modal-box h2 { color: #1a2a3a; font-size: 20px; margin-bottom: 12px; text-align: center; }
    .modal-box p { color: #6c757d; font-size: 14px; text-align: center; margin-bottom: 16px; }
    .modal-box .form-group { margin-bottom: 12px; }
    .modal-box .modal-btn {
      width: 100%; padding: 12px; background: #2563eb; color: white; border: none;
      border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer;
      transition: all 0.3s; font-family: inherit;
    }
    .modal-box .modal-btn:hover { background: #1d4ed8; }
    .modal-box .modal-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    @media (max-width: 600px) {
      body { padding: 12px; }
      .login-container { padding: 20px 16px; border-radius: 20px; }
      .logo h1 { font-size: 22px; }
      .form-group input { font-size: 14px; padding: 10px 14px; }
      .login-btn { font-size: 16px; padding: 12px; }
      .links-row { flex-direction: column; gap: 8px; }
      .modal-box { padding: 24px 18px; }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <!-- الشعار -->
    <div class="logo">
      <h1>آت يونس <span>تك</span></h1>
      <p>منصة الاستثمار الترويجي الذكي</p>
    </div>
    <hr class="divider">

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label>البريد الإلكتروني <span class="required">*</span></label>
        <input type="email" id="email" placeholder="أدخل بريدك الإلكتروني" required>
      </div>
      <div class="form-group">
        <label>كلمة المرور <span class="required">*</span></label>
        <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
      </div>

      <button type="submit" class="login-btn" id="loginBtn">🔑 دخول</button>

      <div id="loginMessage" class="message"></div>

      <div class="links-row">
        <a id="resendActivationLink">📧 إعادة إرسال رابط التفعيل</a>
        <a id="forgotPasswordLink">🔒 نسيت كلمة المرور</a>
      </div>

      <div class="register-link">
        ليس لديك حساب؟ <a href="/register.html">سجل الآن</a>
      </div>
    </form>
  </div>

  <!-- ====== مودال إعادة إرسال التفعيل ====== -->
  <div class="modal-overlay" id="resendModal">
    <div class="modal-box">
      <button class="close-btn" id="closeResendModal">✕</button>
      <h2>📧 إعادة إرسال رابط التفعيل</h2>
      <p>أدخل بريدك الإلكتروني لإعادة إرسال رابط التفعيل.</p>
      <form id="resendForm">
        <div class="form-group">
          <input type="email" id="resendEmail" placeholder="البريد الإلكتروني" required>
        </div>
        <button type="submit" class="modal-btn" id="resendBtn">إرسال الرابط</button>
        <div id="resendMessage" class="message" style="margin-top:10px;"></div>
      </form>
    </div>
  </div>

  <!-- ====== مودال استعادة كلمة المرور ====== -->
  <div class="modal-overlay" id="forgotModal">
    <div class="modal-box">
      <button class="close-btn" id="closeForgotModal">✕</button>
      <h2>🔒 استعادة كلمة المرور</h2>
      <p>أدخل بريدك الإلكتروني لإرسال رابط استعادة كلمة المرور.</p>
      <form id="forgotForm">
        <div class="form-group">
          <input type="email" id="forgotEmail" placeholder="البريد الإلكتروني" required>
        </div>
        <button type="submit" class="modal-btn" id="forgotBtn">إرسال رابط الاستعادة</button>
        <div id="forgotMessage" class="message" style="margin-top:10px;"></div>
      </form>
    </div>
  </div>

  <script>
    // ============================================================
    //  عرض الرسائل
    // ============================================================
    function showMessage(elementId, message, type) {
      const msgDiv = document.getElementById(elementId);
      msgDiv.textContent = message;
      msgDiv.className = `message show ${type}`;
      setTimeout(() => { msgDiv.className = 'message'; }, 6000);
    }

    // ============================================================
    //  تسجيل الدخول
    // ============================================================
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');

      if (!email || !password) {
        showMessage('loginMessage', '❌ يرجى إدخال البريد الإلكتروني وكلمة المرور.', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'جاري التحقق...';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          // رسالة خاصة للحساب غير المفعل
          if (data.message && data.message.includes('غير مفعل')) {
            showMessage('loginMessage', `❌ ${data.message}. يمكنك استخدام زر "إعادة إرسال رابط التفعيل" أدناه.`, 'error');
          } else {
            showMessage('loginMessage', `❌ ${data.message}`, 'error');
          }
          btn.disabled = false;
          btn.textContent = '🔑 دخول';
          return;
        }

        // حفظ التوكن والمستخدم
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));

        showMessage('loginMessage', '✅ تم تسجيل الدخول بنجاح! جاري التحويل...', 'success');

        setTimeout(() => {
          window.location.href = '/dashboard.html';
        }, 1000);

      } catch (error) {
        console.error('❌ خطأ في تسجيل الدخول:', error);
        showMessage('loginMessage', '❌ حدث خطأ في الاتصال بالخادم.', 'error');
        btn.disabled = false;
        btn.textContent = '🔑 دخول';
      }
    });

    // ============================================================
    //  إعادة إرسال رابط التفعيل
    // ============================================================
    document.getElementById('resendActivationLink').addEventListener('click', function(e) {
      e.preventDefault();
      document.getElementById('resendModal').classList.add('active');
      document.getElementById('resendEmail').value = '';
      document.getElementById('resendMessage').className = 'message';
    });

    document.getElementById('closeResendModal').addEventListener('click', function() {
      document.getElementById('resendModal').classList.remove('active');
    });

    document.getElementById('resendModal').addEventListener('click', function(e) {
      if (e.target === this) this.classList.remove('active');
    });

    document.getElementById('resendForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const email = document.getElementById('resendEmail').value.trim();
      const btn = document.getElementById('resendBtn');

      if (!email) {
        showMessage('resendMessage', '❌ يرجى إدخال البريد الإلكتروني.', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'جاري الإرسال...';

      try {
        const response = await fetch('/api/auth/resend-activation', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await response.json();

        if (!response.ok) {
          showMessage('resendMessage', `❌ ${data.message}`, 'error');
          btn.disabled = false;
          btn.textContent = 'إرسال الرابط';
          return;
        }

        showMessage('resendMessage', '✅ تم إعادة إرسال رابط التفعيل! يرجى مراجعة بريدك الإلكتروني.', 'success');
        btn.disabled = false;
        btn.textContent = 'إرسال الرابط';

        setTimeout(() => {
          document.getElementById('resendModal').classList.remove('active');
        }, 3000);

      } catch (error) {
        console.error('❌ خطأ:', error);
        showMessage('resendMessage', '❌ حدث خطأ في الاتصال بالخادم.', 'error');
        btn.disabled = false;
        btn.textContent = 'إرسال الرابط';
      }
    });

    // ============================================================
    //  استعادة كلمة المرور
    // ============================================================
    document.getElementById('forgotPasswordLink').addEventListener('click', function(e) {
      e.preventDefault();
      document.getElementById('forgotModal').classList.add('active');
      document.getElementById('forgotEmail').value = '';
      document.getElementById('forgotMessage').className = 'message';
    });

    document.getElementById('closeForgotModal').addEventListener('click', function() {
      document.getElementById('forgotModal').classList.remove('active');
    });

    document.getElementById('forgotModal').addEventListener('click', function(e) {
      if (e.target === this) this.classList.remove('active');
    });

    document.getElementById('forgotForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const email = document.getElementById('forgotEmail').value.trim();
      const btn = document.getElementById('forgotBtn');

      if (!email) {
        showMessage('forgotMessage', '❌ يرجى إدخال البريد الإلكتروني.', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'جاري الإرسال...';

      try {
        const response = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await response.json();

        if (!response.ok) {
          showMessage('forgotMessage', `❌ ${data.message}`, 'error');
          btn.disabled = false;
          btn.textContent = 'إرسال رابط الاستعادة';
          return;
        }

        showMessage('forgotMessage', '✅ تم إرسال رابط استعادة كلمة المرور! يرجى مراجعة بريدك الإلكتروني.', 'success');
        btn.disabled = false;
        btn.textContent = 'إرسال رابط الاستعادة';

        setTimeout(() => {
          document.getElementById('forgotModal').classList.remove('active');
        }, 3000);

      } catch (error) {
        console.error('❌ خطأ:', error);
        showMessage('forgotMessage', '❌ حدث خطأ في الاتصال بالخادم.', 'error');
        btn.disabled = false;
        btn.textContent = 'إرسال رابط الاستعادة';
      }
    });
  </script>
</body>
</html>
